[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hqc"
version = "0.1.0"
description = "Chapter 21 of the Encryptorium Book of PQC: HQC-inspired IND-CPA PKE core over GF(2)[x]/(x^n-1) with repetition inner code. The chapter explains the salted FO KEM wrapper, the re-encryption check and implicit rejection; this package does not implement them. Uses only the Python standard library."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
