[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "commitment-schemes"
version = "0.1.0"
description = "Chapter 32 of the Encryptorium Book of PQC: pedagogical toy implementations of the four commitment-scheme families analyzed at L2 of the PQ-ZK decomposition (Ch 31). Four modules: toy_kzg (pairing-less KZG sketch + Shor trapdoor recovery), merkle (q-ary Merkle with configurable hash width), fri (toy FRI commitment with folding + proximity), lattice_pcs (scalar-SIS vector commitment; production reduces to Module-SIS). Uses only the Python standard library."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
