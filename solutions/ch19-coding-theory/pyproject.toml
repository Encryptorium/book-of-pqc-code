[project]
name = "coding-theory"
version = "0.1.0"
description = "Chapter 19 of the Encryptorium Book of PQC: linear codes over GF(2), Hamming codes, Goppa codes, and Prange ISD. Uses only the Python standard library."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
