[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lamport-merkle"
version = "0.1.0"
description = "Chapter 14 of the Encryptorium Book of PQC: Lamport one-time signatures, Merkle trees with authentication paths, and the Merkle signature scheme. Uses only the Python standard library (hashlib for SHA-256, os.urandom for randomness)."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
