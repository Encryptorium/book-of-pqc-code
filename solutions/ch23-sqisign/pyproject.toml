[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sqisign"
version = "0.1.0"
description = "Chapter 23 of the Encryptorium Book of PQC: toy SQIsign signature scheme with quaternion algebra and BFS isogeny search at p=431. Uses only the Python standard library."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
